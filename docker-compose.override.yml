services:
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      target: build
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:80"
    command: npm run dev -- --host 0.0.0.0 --port 80

