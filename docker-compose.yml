services:
  # Database Service (MySQL 8.0)
  db:
    container_name: pcbuilder_db
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-P@ssw0rd!123}
      - MYSQL_DATABASE=${DB_DATABASE:-pcbuilder}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-P@ssw0rd!123}"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - pcbuilder_network

  # Distributed Cache Service (Redis)
  redis:
    container_name: pcbuilder_redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pcbuilder_network

  # AI Recommendation Service Placeholder
  ai:
    container_name: pcbuilder_ai
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - pcbuilder_network

  # React Frontend Client Static Server (Fallback Production Server)
  client:
    container_name: pcbuilder_client
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    restart: always
    ports:
      - "3000:80"
    networks:
      - pcbuilder_network

  # Nginx Reverse Proxy / Load Balancer Route Gateway
  nginx:
    container_name: pcbuilder_nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - client
    networks:
      - pcbuilder_network

volumes:
  mysql_data:
    name: pcbuilder_mysql_data
  redis_data:
    name: pcbuilder_redis_data

networks:
  pcbuilder_network:
    name: pcbuilder_network
    driver: bridge
