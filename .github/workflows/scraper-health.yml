name: Scraper Health Canary

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:        # Allows manual canary trigger

jobs:
  canary:
    name: Retailer Scraper Canary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi supabase python-dotenv pytest

      - name: Run Scraper Parser & Health Unit Tests
        run: |
          python -m pytest tests/scrapers/

      - name: Run Scraper Canary Smoke Test
        id: canary_run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m scrapers.smoke_test --json

      - name: Upload Health Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-health-report
          path: scraper_health_report.json
          retention-days: 14

      - name: Check Broken Retailers and Annotate
        if: failure()
        run: |
          if [ -f scraper_health_report.json ]; then
            BROKEN_STORES=$(jq -r '.broken_stores // [] | join(", ")' scraper_health_report.json)
            if [ -n "$BROKEN_STORES" ] && [ "$BROKEN_STORES" != "" ]; then
              echo "::error title=Broken Scrapers Detected::The following retailers failed 3+ consecutive runs: $BROKEN_STORES"
            fi
          fi
